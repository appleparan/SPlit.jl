[default]
# catch22 paper title: "CAnonical Time-series CHaracteristics"
extend-ignore-re = ["CAnonical Time-series CHaracteristics"]

[default.extend-words]
# "Mak" is a surname (Simon Mak, co-author of the SPlit paper), not a typo.
Mak = "Mak"
# `indexin` is the Julia Base function used in the Compress++ tests.
indexin = "indexin"

[files]
# Exported figures carry base64 woff2 font blobs.
extend-exclude = ["docs/src/assets/intuition/*.svg"]
