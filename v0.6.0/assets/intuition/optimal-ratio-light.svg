      <title id="optimal-ratio-title">Optimal test fraction versus model complexity</title>
      <desc id="optimal-ratio-desc">Line chart of the optimal test fraction gamma equals 1 over the square root of p plus 1, dropping steeply for small parameter counts and flattening as p grows, with five example values marked and a dashed reference line at the default ratio of 0.2.</desc>
<style>
@font-face{font-family:'Pretendard';font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'STIX Two Text';font-style:italic;font-weight:400;font-display:block;src:url(data:font/woff2;base64,) format('woff2');}
</style>

      <rect width="100%" height="100%" fill="rgb(245, 245, 245)"></rect>

