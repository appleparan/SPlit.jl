<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nearest-neighbor-title nearest-neighbor-desc" width="960" height="600">
    <title id="nearest-neighbor-title">Support points claim unclaimed rows in turn</title>
    <desc id="nearest-neighbor-desc">Three panels repeat the same three support points and five data rows. Point one claims the row that is also closest to point three, point two claims its closest row, and point three skips the taken row and claims its next-nearest available row.</desc>
<style>
@font-face{font-family:'Pretendard';font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Pretendard';font-style:normal;font-weight:700;font-display:block;src:url(data:font/woff2;base64,) format('woff2');}
</style>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgb(180, 188, 204)"></polygon></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgb(242, 138, 90)"></polygon></marker>
    </defs>
    <rect width="100%" height="100%" fill="rgb(38, 43, 43)"></rect>

    <g font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif">
      <rect x="32" y="40" width="288" height="452" rx="6" fill="rgb(51, 58, 58)" stroke="rgb(95, 103, 103)"></rect>
      <rect x="336" y="40" width="288" height="452" rx="6" fill="rgb(51, 58, 58)" stroke="rgb(95, 103, 103)"></rect>
      <rect x="640" y="40" width="288" height="452" rx="6" fill="rgb(51, 58, 58)" stroke="rgb(95, 103, 103)"></rect>
      <text x="52" y="68" fill="rgb(180, 188, 204)" font-size="9" letter-spacing="0.12em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">TURN 1</text>
      <text x="356" y="68" fill="rgb(180, 188, 204)" font-size="9" letter-spacing="0.12em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">TURN 2</text>
      <text x="660" y="68" fill="rgb(180, 188, 204)" font-size="9" letter-spacing="0.12em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">TURN 3</text>

      <!-- Claim arrows are drawn before marks. -->
      <line x1="92" y1="230" x2="140" y2="290" stroke="rgb(180, 188, 204)" stroke-width="1.2" marker-end="url(#arrow)"></line>
      <line x1="396" y1="230" x2="444" y2="290" stroke="rgba(232, 234, 240, 0.2)" stroke-width="1.2" marker-end="url(#arrow)"></line>
      <line x1="484" y1="136" x2="564" y2="130" stroke="rgb(180, 188, 204)" stroke-width="1.2" marker-end="url(#arrow)"></line>
      <line x1="700" y1="230" x2="748" y2="290" stroke="rgba(232, 234, 240, 0.2)" stroke-width="1.2" marker-end="url(#arrow)"></line>
      <line x1="788" y1="136" x2="868" y2="130" stroke="rgba(232, 234, 240, 0.2)" stroke-width="1.2" marker-end="url(#arrow)"></line>
      <line x1="798" y1="300" x2="748" y2="290" stroke="rgb(242, 138, 90)" stroke-width="1.2" stroke-dasharray="4,3"></line>
      <line x1="798" y1="300" x2="828" y2="220" stroke="rgb(242, 138, 90)" stroke-width="1.4" marker-end="url(#arrow-accent)"></line>

      <rect x="736" y="318" width="56" height="16" rx="2" fill="rgb(38, 43, 43)"></rect>
      <text x="764" y="329" fill="rgb(138, 148, 168)" font-size="8" text-anchor="middle" letter-spacing="0.10em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">TAKEN</text>
      <rect x="820" y="194" width="96" height="16" rx="2" fill="rgb(38, 43, 43)"></rect>
      <text x="868" y="205" fill="rgb(242, 138, 90)" font-size="8" text-anchor="middle" letter-spacing="0.10em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">NEXT NEAREST</text>

      <!-- Same scene in all three panels: five rows. -->
      <g fill="rgba(180, 188, 204, 0.22)" stroke="rgb(180, 188, 204)">
        <circle cx="140" cy="290" r="4"></circle><circle cx="260" cy="130" r="4"></circle><circle cx="220" cy="220" r="4"></circle><circle cx="70" cy="420" r="4"></circle><circle cx="280" cy="420" r="4"></circle>
        <circle cx="444" cy="290" r="4"></circle><circle cx="564" cy="130" r="4"></circle><circle cx="524" cy="220" r="4"></circle><circle cx="374" cy="420" r="4"></circle><circle cx="584" cy="420" r="4"></circle>
        <circle cx="748" cy="290" r="4"></circle><circle cx="868" cy="130" r="4"></circle><circle cx="828" cy="220" r="4"></circle><circle cx="678" cy="420" r="4"></circle><circle cx="888" cy="420" r="4"></circle>
      </g>
      <!-- Claimed state accumulates by turn. -->
      <circle cx="140" cy="290" r="4" fill="rgb(232, 234, 240)"></circle>
      <circle cx="444" cy="290" r="4" fill="rgb(232, 234, 240)"></circle><circle cx="564" cy="130" r="4" fill="rgb(232, 234, 240)"></circle>
      <circle cx="748" cy="290" r="4" fill="rgb(232, 234, 240)"></circle><circle cx="868" cy="130" r="4" fill="rgb(232, 234, 240)"></circle><circle cx="828" cy="220" r="4" fill="rgb(232, 234, 240)"></circle>

      <!-- Same three support points in each panel. -->
      <g fill="rgb(38, 43, 43)" stroke="rgb(232, 234, 240)" stroke-width="1.2">
        <circle cx="92" cy="230" r="6"></circle><circle cx="180" cy="136" r="6"></circle><circle cx="190" cy="300" r="6"></circle>
        <circle cx="396" cy="230" r="6"></circle><circle cx="484" cy="136" r="6"></circle><circle cx="494" cy="300" r="6"></circle>
        <circle cx="700" cy="230" r="6"></circle><circle cx="788" cy="136" r="6"></circle>
      </g>
      <circle cx="798" cy="300" r="6" fill="rgba(242, 138, 90, 0.12)" stroke="rgb(242, 138, 90)" stroke-width="1.2"></circle>
      <g fill="rgb(232, 234, 240)" font-size="9" font-weight="700" text-anchor="middle">
        <text x="80" y="218" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif" font-weight="700">1</text><text x="168" y="124" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif" font-weight="700">2</text><text x="194" y="288" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif" font-weight="700">3</text>
        <text x="384" y="218" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif" font-weight="700">1</text><text x="472" y="124" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif" font-weight="700">2</text><text x="498" y="288" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif" font-weight="700">3</text>
        <text x="688" y="218" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif" font-weight="700">1</text><text x="776" y="124" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif" font-weight="700">2</text>
      </g>
      <text x="802" y="288" fill="rgb(242, 138, 90)" font-size="9" font-weight="700" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">3</text>

      <text x="904" y="452" fill="rgb(180, 188, 204)" font-size="13" font-style="italic" text-anchor="end" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">musical chairs:</text>
      <text x="904" y="470" fill="rgb(180, 188, 204)" font-size="13" font-style="italic" text-anchor="end" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">the nearest empty chair</text>
      <path d="M 760 448 Q 820 436 876 420" fill="none" stroke="rgba(232, 234, 240, 0.4)" stroke-dasharray="4,3"></path>
      <circle cx="876" cy="420" r="2" fill="rgb(232, 234, 240)"></circle>

      <g letter-spacing="0.06em">
      <line x1="40" y1="516" x2="920" y2="516" stroke="rgba(232, 234, 240, 0.12)" stroke-width="0.8"></line>
      <text x="40" y="536" fill="rgb(180, 188, 204)" font-size="8" letter-spacing="0.12em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">LEGEND</text>
      <circle cx="52" cy="560" r="6" fill="rgb(38, 43, 43)" stroke="rgb(232, 234, 240)" stroke-width="1.2"></circle><text x="66" y="564" fill="rgb(232, 234, 240)" font-size="9" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">SUPPORT POINT</text>
      <circle cx="188" cy="560" r="4" fill="rgba(180, 188, 204, 0.22)" stroke="rgb(180, 188, 204)"></circle><text x="200" y="564" fill="rgb(232, 234, 240)" font-size="9" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">DATA ROW</text>
      <circle cx="292" cy="560" r="4" fill="rgb(232, 234, 240)"></circle><text x="304" y="564" fill="rgb(232, 234, 240)" font-size="9" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">CLAIMED ROW</text>
      <line x1="420" y1="560" x2="444" y2="560" stroke="rgb(180, 188, 204)" marker-end="url(#arrow)"></line><text x="452" y="564" fill="rgb(232, 234, 240)" font-size="9" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">CLAIM</text>
      <line x1="536" y1="560" x2="560" y2="560" stroke="rgb(242, 138, 90)" stroke-dasharray="4,3"></line><text x="568" y="564" fill="rgb(232, 234, 240)" font-size="9" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">ALREADY TAKEN</text>
      </g>
    </g>
  </svg>
