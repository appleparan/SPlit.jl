    <rect x="536" y="408" width="64" height="14" rx="2" fill="rgb(236, 236, 236)"></rect>
    <text x="568" y="418" fill="rgb(79, 93, 117)" font-size="8" text-anchor="middle" letter-spacing="0.10em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">WITHIN A</text>
    <rect x="772" y="128" width="64" height="14" rx="2" fill="rgb(236, 236, 236)"></rect>
