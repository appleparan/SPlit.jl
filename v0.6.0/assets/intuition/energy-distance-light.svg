<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="energy-distance-title energy-distance-desc" width="960" height="600">
    <title id="energy-distance-title">Energy distance compares cross-group and within-group distances</title>
    <desc id="energy-distance-desc">Two panels compare samples A, shown as filled gray circles, and B, shown as filled blue squares. Intermingled samples have similar cross-group and within-group distances, while separated samples have much longer cross-group distances.</desc>
<style>
@font-face{font-family:'Pretendard';font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Pretendard';font-style:normal;font-weight:600;font-display:block;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'STIX Two Text';font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,) format('woff2');}
</style>
