<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="support-points-title support-points-desc" width="960" height="600">
    <title id="support-points-title">Support point pulled by data, pushed by another support point</title>
    <desc id="support-points-desc">A schematic point cloud showing one support point sitting too close to a neighboring support point, balanced between an attraction toward nearby data rows and a repulsion away from that neighbor, moving to a next position that still covers a sparse region.</desc>
<style>
@font-face{font-family:'Pretendard';font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,) format('woff2');}
</style>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgb(180, 188, 204)"></polygon></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgb(242, 138, 90)"></polygon></marker>
    </defs>

    <rect width="100%" height="100%" fill="rgb(38, 43, 43)"></rect>

    <!-- ============ FORCE ARROWS (drawn before points) ============ -->

    <!-- ATTRACTION: solid muted, toward the cluster -->
    <line x1="333" y1="315" x2="256" y2="260" stroke="rgb(180, 188, 204)" stroke-width="1.4" marker-end="url(#arrow)"></line>

    <!-- REPULSION: dashed muted, straight away from S_dense -->
    <line x1="348" y1="321" x2="404" y2="332" stroke="rgb(180, 188, 204)" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"></line>

    <!-- NEXT POSITION: accent, resultant -->
    <line x1="342" y1="312" x2="352" y2="268" stroke="rgb(242, 138, 90)" stroke-width="1.8" marker-end="url(#arrow-accent)"></line>

    <!-- ============ DATA ROWS — dense cluster (left-center) ============ -->
    <g fill="rgba(180, 188, 204, 0.22)" stroke="rgb(180, 188, 204)" stroke-width="1">
      <circle cx="120" cy="160" r="4"></circle>
      <circle cx="160" cy="140" r="4"></circle>
      <circle cx="210" cy="130" r="4"></circle>
      <circle cx="260" cy="160" r="4"></circle>
      <circle cx="300" cy="200" r="4"></circle>
      <circle cx="110" cy="220" r="4"></circle>
      <circle cx="150" cy="200" r="4"></circle>
      <circle cx="200" cy="190" r="4"></circle>
      <circle cx="240" cy="220" r="4"></circle>
      <circle cx="280" cy="250" r="4"></circle>
      <circle cx="130" cy="270" r="4"></circle>
      <circle cx="170" cy="250" r="4"></circle>
      <circle cx="210" cy="260" r="4"></circle>
      <circle cx="250" cy="290" r="4"></circle>
      <circle cx="290" cy="300" r="4"></circle>
      <circle cx="170" cy="300" r="4"></circle>
    </g>

    <!-- ============ DATA ROWS — sparse spread (right / bottom-right) ============ -->
    <g fill="rgba(180, 188, 204, 0.22)" stroke="rgb(180, 188, 204)" stroke-width="1">
      <circle cx="560" cy="120" r="4"></circle>
      <circle cx="660" cy="160" r="4"></circle>
      <circle cx="760" cy="120" r="4"></circle>
      <circle cx="860" cy="180" r="4"></circle>
      <circle cx="600" cy="320" r="4"></circle>
      <circle cx="700" cy="380" r="4"></circle>
      <circle cx="820" cy="300" r="4"></circle>
      <circle cx="880" cy="420" r="4"></circle>
      <circle cx="520" cy="460" r="4"></circle>
      <circle cx="680" cy="480" r="4"></circle>
    </g>

    <!-- ============ SUPPORT POINTS ============ -->

    <!-- S_dense: inside the lower part of the cluster -->
    <circle cx="232" cy="300" r="6" fill="rgb(38, 43, 43)" stroke="rgb(232, 234, 240)" stroke-width="1.2"></circle>
    <!-- S_right -->
    <circle cx="760" cy="220" r="6" fill="rgb(38, 43, 43)" stroke="rgb(232, 234, 240)" stroke-width="1.2"></circle>
    <!-- S_bottom -->
    <circle cx="560" cy="440" r="6" fill="rgb(38, 43, 43)" stroke="rgb(232, 234, 240)" stroke-width="1.2"></circle>

    <!-- focal support point F (current position) -->
    <circle cx="340" cy="320" r="6" fill="rgba(242, 138, 90, 0.12)" stroke="rgb(242, 138, 90)" stroke-width="1.2"></circle>

    <!-- next position (dashed-outline accent circle) -->
    <circle cx="352" cy="268" r="6" fill="rgb(38, 43, 43)" stroke="rgb(242, 138, 90)" stroke-width="1.2" stroke-dasharray="3,2"></circle>

    <!-- ============ EDITORIAL ASIDE ============ -->
    <text x="912" y="76" fill="rgb(180, 188, 204)" font-size="13" font-style="italic" font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif" text-anchor="end">enough repulsion to still</text>
    <text x="912" y="96" fill="rgb(180, 188, 204)" font-size="13" font-style="italic" font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif" text-anchor="end">cover where the data is sparse</text>
    <path d="M 860 104 Q 820 150 764 232" fill="none" stroke="rgba(232, 234, 240, 0.4)" stroke-width="1" stroke-dasharray="4,3"></path>
    <circle cx="764" cy="236" r="2" fill="rgb(232, 234, 240)"></circle>

    <!-- ============ LEGEND ============ -->
    <line x1="40" y1="516" x2="920" y2="516" stroke="rgba(232, 234, 240, 0.12)" stroke-width="0.8"></line>

    <circle cx="52" cy="540" r="4" fill="rgba(180, 188, 204, 0.22)" stroke="rgb(180, 188, 204)" stroke-width="1"></circle>
    <text x="64" y="544" fill="rgb(180, 188, 204)" font-size="9" font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif" letter-spacing="0.10em">DATA ROW</text>

    <circle cx="196" cy="540" r="6" fill="rgb(38, 43, 43)" stroke="rgb(232, 234, 240)" stroke-width="1.2"></circle>
    <text x="210" y="544" fill="rgb(180, 188, 204)" font-size="9" font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif" letter-spacing="0.10em">SUPPORT POINT</text>

    <line x1="360" y1="540" x2="384" y2="540" stroke="rgb(180, 188, 204)" stroke-width="1.2" marker-end="url(#arrow)"></line>
    <text x="392" y="544" fill="rgb(180, 188, 204)" font-size="9" font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif" letter-spacing="0.10em">ATTRACTION</text>

    <line x1="516" y1="540" x2="540" y2="540" stroke="rgb(180, 188, 204)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"></line>
    <text x="548" y="544" fill="rgb(180, 188, 204)" font-size="9" font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif" letter-spacing="0.10em">REPULSION</text>

    <line x1="672" y1="540" x2="696" y2="540" stroke="rgb(242, 138, 90)" stroke-width="1.6" marker-end="url(#arrow-accent)"></line>
    <text x="704" y="544" fill="rgb(180, 188, 204)" font-size="9" font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif" letter-spacing="0.10em">NEXT POSITION</text>
  </svg>
