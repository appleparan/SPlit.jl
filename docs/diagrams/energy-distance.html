<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energy distance</title>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif; background: var(--paper); padding: 2rem; }
    svg { width: 100%; max-width: 960px; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="energy-distance-title energy-distance-desc">
    <title id="energy-distance-title">Energy distance compares cross-group and within-group distances</title>
    <desc id="energy-distance-desc">Two panels compare samples A, shown as filled gray circles, and B, shown as filled blue squares. Intermingled samples have similar cross-group and within-group distances, while separated samples have much longer cross-group distances.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="var(--paper)"/>

    <rect x="40" y="40" width="416" height="460" rx="8" fill="var(--panel)" stroke="var(--ink-a12)"/>
    <line x1="80" y1="332" x2="192" y2="312" stroke="var(--accent)" stroke-width="1.2"/>
    <line x1="276" y1="324" x2="180" y2="408" stroke="var(--muted)" stroke-dasharray="4,3"/>
    <line x1="380" y1="144" x2="296" y2="236" stroke="var(--blue)" stroke-dasharray="4,3"/>
    <rect x="112" y="300" width="48" height="14" rx="2" fill="var(--panel)"/>
    <text x="136" y="310" fill="var(--accent)" font-size="8" text-anchor="middle" letter-spacing="0.10em">CROSS</text>
    <rect x="200" y="364" width="64" height="14" rx="2" fill="var(--panel)"/>
    <text x="232" y="374" fill="var(--muted)" font-size="8" text-anchor="middle" letter-spacing="0.10em">WITHIN A</text>
    <rect x="296" y="180" width="64" height="14" rx="2" fill="var(--panel)"/>
    <text x="328" y="190" fill="var(--blue)" font-size="8" text-anchor="middle" letter-spacing="0.10em">WITHIN B</text>
    <g fill="var(--muted)">
      <circle cx="292" cy="132" r="5"/><circle cx="184" cy="216" r="5"/><circle cx="376" cy="224" r="5"/>
      <circle cx="80" cy="332" r="5"/><circle cx="276" cy="324" r="5"/><circle cx="180" cy="408" r="5"/><circle cx="384" cy="404" r="5"/>
    </g>
    <g fill="var(--blue)">
      <rect x="375" y="139" width="10" height="10"/><rect x="95" y="227" width="10" height="10"/><rect x="291" y="231" width="10" height="10"/>
      <rect x="187" y="307" width="10" height="10"/><rect x="391" y="303" width="10" height="10"/><rect x="87" y="415" width="10" height="10"/><rect x="295" y="419" width="10" height="10"/>
    </g>
    <text x="56" y="64" fill="var(--muted)" font-size="8" letter-spacing="0.12em">SAME CROWD</text>
    <text x="56" y="88" fill="var(--ink)" font-size="12" font-weight="600">cross</text>
    <text x="92" y="88" fill="var(--ink)" font-size="12" font-weight="600"><tspan font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif">≈</tspan></text>
    <text x="108" y="88" fill="var(--ink)" font-size="12" font-weight="600">within</text>
    <text x="150" y="88" fill="var(--ink)" font-size="12" font-weight="600"><tspan font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif">→</tspan></text>
    <text x="170" y="88" fill="var(--ink)" font-size="12" font-weight="600">energy distance</text>
    <text x="270" y="88" fill="var(--ink)" font-size="12" font-weight="600"><tspan font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif">≈ 0</tspan></text>
    <text x="72" y="116" fill="var(--muted)" font-size="13" font-style="italic">two random samples</text>
    <text x="72" y="134" fill="var(--muted)" font-size="13" font-style="italic">from the same crowd</text>
    <path d="M 152 140 Q 164 174 184 216" fill="none" stroke="var(--ink-a40)" stroke-dasharray="4,3"/>
    <circle cx="184" cy="216" r="2" fill="var(--ink)"/>

    <rect x="504" y="40" width="416" height="460" rx="8" fill="var(--panel)" stroke="var(--ink-a12)"/>
    <line x1="592" y1="392" x2="832" y2="204" stroke="var(--accent)" stroke-width="1.2"/>
    <line x1="536" y1="392" x2="592" y2="448" stroke="var(--muted)" stroke-dasharray="4,3"/>
    <line x1="776" y1="148" x2="832" y2="148" stroke="var(--blue)" stroke-dasharray="4,3"/>
    <rect x="684" y="284" width="48" height="14" rx="2" fill="var(--panel)"/>
    <text x="708" y="294" fill="var(--accent)" font-size="8" text-anchor="middle" letter-spacing="0.10em">CROSS</text>
    <rect x="536" y="408" width="64" height="14" rx="2" fill="var(--panel)"/>
    <text x="568" y="418" fill="var(--muted)" font-size="8" text-anchor="middle" letter-spacing="0.10em">WITHIN A</text>
    <rect x="772" y="128" width="64" height="14" rx="2" fill="var(--panel)"/>
    <text x="804" y="138" fill="var(--blue)" font-size="8" text-anchor="middle" letter-spacing="0.10em">WITHIN B</text>
    <g fill="var(--muted)">
      <circle cx="536" cy="336" r="5"/><circle cx="592" cy="336" r="5"/><circle cx="536" cy="392" r="5"/>
      <circle cx="592" cy="392" r="5"/><circle cx="536" cy="448" r="5"/><circle cx="592" cy="448" r="5"/><circle cx="648" cy="448" r="5"/>
    </g>
    <g fill="var(--blue)">
      <rect x="771" y="143" width="10" height="10"/><rect x="827" y="143" width="10" height="10"/><rect x="883" y="143" width="10" height="10"/>
      <rect x="827" y="199" width="10" height="10"/><rect x="883" y="199" width="10" height="10"/><rect x="827" y="255" width="10" height="10"/><rect x="883" y="255" width="10" height="10"/>
    </g>
    <text x="520" y="64" fill="var(--muted)" font-size="8" letter-spacing="0.12em">DIFFERENT POPULATIONS</text>
    <text x="520" y="88" fill="var(--ink)" font-size="12" font-weight="600">cross</text>
    <text x="556" y="88" fill="var(--ink)" font-size="12" font-weight="600"><tspan font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif">≫</tspan></text>
    <text x="574" y="88" fill="var(--ink)" font-size="12" font-weight="600">within</text>
    <text x="616" y="88" fill="var(--ink)" font-size="12" font-weight="600"><tspan font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif">→</tspan></text>
    <text x="636" y="88" fill="var(--ink)" font-size="12" font-weight="600">energy distance large</text>

    <line x1="40" y1="516" x2="920" y2="516" stroke="var(--ink-a12)" stroke-width="0.8"/>
    <text x="40" y="536" fill="var(--muted)" font-size="8" letter-spacing="0.12em">LEGEND</text>
    <circle cx="56" cy="560" r="5" fill="var(--muted)"/>
    <text x="68" y="564" fill="var(--ink)" font-size="9" letter-spacing="0.08em">GROUP A ROW</text>
    <rect x="256" y="555" width="10" height="10" fill="var(--blue)"/>
    <text x="276" y="564" fill="var(--ink)" font-size="9" letter-spacing="0.08em">GROUP B ROW</text>
    <line x1="472" y1="560" x2="496" y2="560" stroke="var(--accent)" stroke-width="1.2"/>
    <text x="504" y="564" fill="var(--ink)" font-size="9" letter-spacing="0.08em">CROSS-DISTANCE</text>
    <line x1="704" y1="560" x2="728" y2="560" stroke="var(--muted)" stroke-dasharray="4,3"/>
    <text x="736" y="564" fill="var(--ink)" font-size="9" letter-spacing="0.08em">WITHIN-DISTANCE</text>
  </svg>
</body>
</html>
