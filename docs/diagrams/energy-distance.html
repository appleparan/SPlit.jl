<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energy distance</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    svg { width: 100%; min-width: 800px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="energy-distance-title energy-distance-desc">
      <title id="energy-distance-title">Energy distance: two groups in a room</title>
      <desc id="energy-distance-desc">Two point-cloud panels compare the average cross-group distance with the average within-group distance. When group A and group B are the same crowd, cross and within distances are similar and the energy distance is near zero. When the groups are different populations sitting apart, the cross distance is much larger than either within distance and the energy distance is large.</desc>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ LEFT PANEL: SAME CROWD ============ -->
      <rect x="40" y="40" width="416" height="460" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- left panel distance lines (drawn before points so points sit on top) -->
      <!-- CROSS A-B -->
      <line x1="80" y1="332" x2="192" y2="312" stroke="#eb6c36" stroke-width="1.2"/>
      <!-- WITHIN A -->
      <line x1="276" y1="324" x2="180" y2="408" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <!-- WITHIN B -->
      <line x1="380" y1="144" x2="296" y2="236" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- left panel line-end dots (reinforce measurement, sit under point circles) -->
      <circle cx="80" cy="332" r="4" fill="#f5f5f5"/>
      <circle cx="192" cy="312" r="4" fill="#f5f5f5"/>
      <circle cx="276" cy="324" r="4" fill="#f5f5f5"/>
      <circle cx="180" cy="408" r="4" fill="#f5f5f5"/>
      <circle cx="380" cy="144" r="4" fill="#f5f5f5"/>
      <circle cx="296" cy="236" r="4" fill="#f5f5f5"/>

      <!-- left panel distance labels (mono 8px, paper mask, 6-10px off the line's midpoint) -->
      <rect x="116" y="300" width="40" height="12" rx="2" fill="#ececec"/>
      <text x="136" y="308" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CROSS</text>

      <rect x="204" y="364" width="60" height="12" rx="2" fill="#ececec"/>
      <text x="232" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WITHIN A</text>

      <rect x="300" y="180" width="60" height="12" rx="2" fill="#ececec"/>
      <text x="328" y="188" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WITHIN B</text>

      <!-- left panel group A points (irregular spacing, no shared row/column) -->
      <circle cx="292" cy="132" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="184" cy="216" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="376" cy="224" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="80" cy="332" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="276" cy="324" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="180" cy="408" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="384" cy="404" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>

      <!-- left panel group B points (irregular spacing, no shared row/column) -->
      <circle cx="380" cy="144" r="4" fill="rgba(46,90,168,0.20)" stroke="#2e5aa8" stroke-width="1"/>
      <circle cx="100" cy="232" r="4" fill="rgba(46,90,168,0.20)" stroke="#2e5aa8" stroke-width="1"/>
      <circle cx="296" cy="236" r="4" fill="rgba(46,90,168,0.20)" stroke="#2e5aa8" stroke-width="1"/>
      <circle cx="192" cy="312" r="4" fill="rgba(46,90,168,0.20)" stroke="#2e5aa8" stroke-width="1"/>
      <circle cx="396" cy="308" r="4" fill="rgba(46,90,168,0.20)" stroke="#2e5aa8" stroke-width="1"/>
      <circle cx="92" cy="420" r="4" fill="rgba(46,90,168,0.20)" stroke="#2e5aa8" stroke-width="1"/>
      <circle cx="300" cy="424" r="4" fill="rgba(46,90,168,0.20)" stroke="#2e5aa8" stroke-width="1"/>

      <!-- left panel header -->
      <text x="56" y="64" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SAME CROWD</text>
      <text x="56" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">cross &#8776; within &#8594; energy distance &#8776; 0</text>

      <!-- ============ RIGHT PANEL: DIFFERENT POPULATIONS ============ -->
      <rect x="504" y="40" width="416" height="460" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- right panel distance lines -->
      <!-- CROSS A-B (long, spans the empty gap) -->
      <line x1="592" y1="392" x2="832" y2="204" stroke="#eb6c36" stroke-width="1.2"/>
      <!-- WITHIN A -->
      <line x1="536" y1="392" x2="592" y2="448" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <!-- WITHIN B -->
      <line x1="776" y1="148" x2="832" y2="148" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- right panel line-end dots -->
      <circle cx="592" cy="392" r="4" fill="#f5f5f5"/>
      <circle cx="832" cy="204" r="4" fill="#f5f5f5"/>
      <circle cx="536" cy="392" r="4" fill="#f5f5f5"/>
      <circle cx="592" cy="448" r="4" fill="#f5f5f5"/>
      <circle cx="776" cy="148" r="4" fill="#f5f5f5"/>
      <circle cx="832" cy="148" r="4" fill="#f5f5f5"/>

      <!-- right panel distance labels (6-10px from each line's midpoint) -->
      <rect x="688" y="284" width="40" height="12" rx="2" fill="#ececec"/>
      <text x="708" y="292" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CROSS</text>

      <rect x="540" y="408" width="60" height="12" rx="2" fill="#ececec"/>
      <text x="568" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WITHIN A</text>

      <rect x="776" y="132" width="60" height="12" rx="2" fill="#ececec"/>
      <text x="804" y="140" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WITHIN B</text>

      <!-- right panel group A points (lower-left cluster) -->
      <circle cx="536" cy="336" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="592" cy="336" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="536" cy="392" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="592" cy="392" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="536" cy="448" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="592" cy="448" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="648" cy="448" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>

      <!-- right panel group B points (upper-right cluster) -->
      <circle cx="776" cy="148" r="4" fill="rgba(46,90,168,0.20)" stroke="#2e5aa8" stroke-width="1"/>
      <circle cx="832" cy="148" r="4" fill="rgba(46,90,168,0.20)" stroke="#2e5aa8" stroke-width="1"/>
      <circle cx="888" cy="148" r="4" fill="rgba(46,90,168,0.20)" stroke="#2e5aa8" stroke-width="1"/>
      <circle cx="832" cy="204" r="4" fill="rgba(46,90,168,0.20)" stroke="#2e5aa8" stroke-width="1"/>
      <circle cx="888" cy="204" r="4" fill="rgba(46,90,168,0.20)" stroke="#2e5aa8" stroke-width="1"/>
      <circle cx="832" cy="260" r="4" fill="rgba(46,90,168,0.20)" stroke="#2e5aa8" stroke-width="1"/>
      <circle cx="888" cy="260" r="4" fill="rgba(46,90,168,0.20)" stroke="#2e5aa8" stroke-width="1"/>

      <!-- right panel header -->
      <text x="520" y="64" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DIFFERENT POPULATIONS</text>
      <text x="520" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">cross &#8811; within &#8594; energy distance large</text>

      <!-- ============ LEGEND STRIP (bottom 60px) ============ -->
      <line x1="40" y1="508" x2="920" y2="508" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <circle cx="56" cy="548" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
      <text x="68" y="552" fill="#2d3142" font-size="12" font-weight="400" font-family="'Geist', sans-serif">Group A row</text>

      <circle cx="284" cy="548" r="4" fill="rgba(46,90,168,0.20)" stroke="#2e5aa8" stroke-width="1"/>
      <text x="296" y="552" fill="#2d3142" font-size="12" font-weight="400" font-family="'Geist', sans-serif">Group B row</text>

      <line x1="504" y1="548" x2="524" y2="548" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="532" y="552" fill="#2d3142" font-size="12" font-weight="400" font-family="'Geist', sans-serif">Cross-distance</text>

      <line x1="712" y1="548" x2="732" y2="548" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="740" y="552" fill="#2d3142" font-size="12" font-weight="400" font-family="'Geist', sans-serif">Within-distance</text>
    </svg>
  </div>
</body>
</html>
