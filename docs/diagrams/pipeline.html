<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The SPlit.jl splitting pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc">
      <title id="pipeline-title">The SPlit.jl splitting pipeline</title>
      <desc id="pipeline-desc">Flowchart of datasplit: rows are preprocessed, then either support points are placed and nearby rows are claimed, or kernel herding picks rows directly, and both routes produce the final two-sided split.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= ARROWS (drawn before nodes) ================= -->

      <!-- Main lane, y-aligned, plain horizontal lines -->
      <line x1="160" y1="160" x2="192" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="332" y1="160" x2="364" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="544" y1="160" x2="576" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="776" y1="160" x2="808" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Alternative route: Preprocess -> Kernel herding (drop from bottom, enter left edge) -->
      <path d="M 262,208 V 344 Q 262,352 270,352 H 440"
            fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>

      <!-- Alternative route: Kernel herding -> Split (exit right edge, rise into bottom) -->
      <path d="M 580,352 H 856 Q 864,352 864,344 V 208"
            fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>

      <!-- ================= LANE TAGS ================= -->
      <text x="40" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SupportPointSplitter</text>
      <text x="40" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">HerdingSplitter</text>

      <!-- ================= NODES ================= -->

      <!-- 1. Data (input style) -->
      <rect x="40" y="112" width="120" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="112" width="120" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="100" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Data</text>
      <text x="100" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">N rows</text>
      <text x="100" y="174" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">numeric + categorical</text>

      <!-- 2. Preprocess (backend/step style) -->
      <rect x="192" y="112" width="140" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="262" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Preprocess</text>
      <text x="262" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Helmert encode · drop</text>
      <text x="262" y="174" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">constants · standardize</text>

      <!-- 3. Support points (FOCAL) -->
      <rect x="364" y="112" width="180" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="364" y="112" width="180" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="454" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Support points</text>
      <text x="454" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">n = ratio · N ideal locations,</text>
      <text x="454" y="174" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">moved by MM sweeps</text>

      <!-- 4. Nearest-neighbor claim (backend/step style) -->
      <rect x="576" y="112" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="676" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nearest-neighbor claim</text>
      <text x="676" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">each point takes the nearest</text>
      <text x="676" y="174" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">unclaimed row (k-d tree)</text>

      <!-- 6. Split (end oval) -->
      <rect x="808" y="112" width="112" height="96" rx="48" fill="#f5f5f5"/>
      <rect x="808" y="112" width="112" height="96" rx="48" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="864" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Split</text>
      <text x="864" y="154" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">claimed rows →</text>
      <text x="864" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">smaller side · the</text>
      <text x="864" y="182" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">rest → other side</text>

      <!-- 5. Kernel herding (lower lane, optional/async style) -->
      <rect x="440" y="304" width="140" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="304" width="140" height="96" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="510" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kernel herding</text>
      <text x="510" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pick rows one at a</text>
      <text x="510" y="366" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">time, directly</text>

      <!-- ================= EDITORIAL ASIDES ================= -->

      <!-- Aside near Support points -->
      <text x="620" y="56" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">ideal locations first,</text>
      <text x="620" y="74" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">real rows second</text>
      <path d="M 560,80 Q 500,96 454,112" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="454" cy="112" r="2" fill="#2d3142"/>

      <!-- Aside near Split -->
      <text x="920" y="440" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">the claimed side becomes the test set</text>
      <text x="920" y="460" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">when ratio ≤ 0.5</text>
      <path d="M 900,428 Q 902,310 904,194" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="904" cy="194" r="2" fill="#2d3142"/>

    </svg>
  </div>
</body>
</html>
