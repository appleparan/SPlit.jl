<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kernel herding balances the selected rows</title>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif; background: var(--paper); padding: 2rem; }
    svg { width: 100%; max-width: 960px; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="herding-title herding-desc">
    <title id="herding-title">Kernel herding chooses the row that best restores balance</title>
    <desc id="herding-desc">Two clusters contain eleven rows. All three rows selected so far are in the left cluster, so the next pick is a row in the previously uncovered right cluster.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="var(--paper)"/>

    <rect x="596" y="172" width="232" height="196" rx="48" fill="var(--blue-a20)" stroke="var(--blue-a20)"/>
    <text x="600" y="388" fill="var(--blue)" font-size="9" letter-spacing="0.12em">NO PICK HERE YET</text>

    <rect x="412" y="76" width="136" height="32" rx="6" fill="var(--surface)" stroke="var(--ink-a20)"/>
    <text x="480" y="96" fill="var(--ink)" font-size="10" text-anchor="middle">picked so far: 3</text>
    <path d="M 548 92 C 620 92 688 140 716 226" fill="none" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <g fill="var(--muted-a20)" stroke="var(--muted)">
      <circle cx="156" cy="196" r="4"/><circle cx="260" cy="156" r="4"/><circle cx="344" cy="232" r="4"/>
      <circle cx="172" cy="332" r="4"/><circle cx="276" cy="372" r="4"/><circle cx="360" cy="312" r="4"/>
      <circle cx="620" cy="216" r="4"/><circle cx="720" cy="240" r="4"/><circle cx="804" cy="196" r="4"/>
      <circle cx="656" cy="340" r="4"/><circle cx="784" cy="344" r="4"/>
    </g>
    <circle cx="156" cy="196" r="4" fill="var(--ink)"/>
    <circle cx="276" cy="372" r="4" fill="var(--ink)"/>
    <circle cx="360" cy="312" r="4" fill="var(--ink)"/>
    <circle cx="720" cy="240" r="9" fill="none" stroke="var(--accent)" stroke-width="1.8"/>

    <text x="72" y="448" fill="var(--muted)" font-size="13" font-style="italic">team draft: add whoever best balances</text>
    <text x="72" y="468" fill="var(--muted)" font-size="13" font-style="italic">the roster you already have</text>
    <path d="M 420 440 C 500 412 520 304 706 254" fill="none" stroke="var(--ink-a40)" stroke-dasharray="4,3"/>
    <circle cx="706" cy="254" r="2" fill="var(--ink)"/>

    <line x1="40" y1="516" x2="920" y2="516" stroke="var(--ink-a12)" stroke-width="0.8"/>
    <text x="40" y="536" fill="var(--muted)" font-size="8" letter-spacing="0.12em">LEGEND</text>
    <circle cx="52" cy="560" r="4" fill="var(--muted-a20)" stroke="var(--muted)"/>
    <text x="64" y="564" fill="var(--ink)" font-size="9" letter-spacing="0.08em">DATA ROW</text>
    <circle cx="220" cy="560" r="4" fill="var(--ink)"/>
    <text x="232" y="564" fill="var(--ink)" font-size="9" letter-spacing="0.08em">PICKED ROW</text>
    <circle cx="388" cy="560" r="4" fill="var(--muted-a20)" stroke="var(--muted)"/><circle cx="388" cy="560" r="9" fill="none" stroke="var(--accent)" stroke-width="1.8"/>
    <text x="404" y="564" fill="var(--ink)" font-size="9" letter-spacing="0.08em">NEXT PICK</text>
  </svg>
</body>
</html>
