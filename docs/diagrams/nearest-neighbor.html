<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearest-neighbor claiming in three turns</title>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif; background: var(--paper); padding: 2rem; }
    svg { width: 100%; max-width: 960px; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nearest-neighbor-title nearest-neighbor-desc">
    <title id="nearest-neighbor-title">Support points claim unclaimed rows in turn</title>
    <desc id="nearest-neighbor-desc">Three panels repeat the same three support points and five data rows. Point one claims the row that is also closest to point three, point two claims its closest row, and point three skips the taken row and claims its next-nearest available row.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="var(--paper)"/>

    <g font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif">
      <rect x="32" y="40" width="288" height="452" rx="6" fill="var(--surface)" stroke="var(--rule)"/>
      <rect x="336" y="40" width="288" height="452" rx="6" fill="var(--surface)" stroke="var(--rule)"/>
      <rect x="640" y="40" width="288" height="452" rx="6" fill="var(--surface)" stroke="var(--rule)"/>
      <text x="52" y="68" fill="var(--muted)" font-size="9" letter-spacing="0.12em">TURN 1</text>
      <text x="356" y="68" fill="var(--muted)" font-size="9" letter-spacing="0.12em">TURN 2</text>
      <text x="660" y="68" fill="var(--muted)" font-size="9" letter-spacing="0.12em">TURN 3</text>

      <!-- Claim arrows are drawn before marks. -->
      <line x1="92" y1="230" x2="140" y2="290" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="396" y1="230" x2="444" y2="290" stroke="var(--ink-a20)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="484" y1="136" x2="564" y2="130" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="700" y1="230" x2="748" y2="290" stroke="var(--ink-a20)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="788" y1="136" x2="868" y2="130" stroke="var(--ink-a20)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="798" y1="300" x2="748" y2="290" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="4,3"/>
      <line x1="798" y1="300" x2="828" y2="220" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="736" y="318" width="56" height="16" rx="2" fill="var(--paper)"/>
      <text x="764" y="329" fill="var(--soft)" font-size="8" text-anchor="middle" letter-spacing="0.10em">TAKEN</text>
      <rect x="820" y="194" width="96" height="16" rx="2" fill="var(--paper)"/>
      <text x="868" y="205" fill="var(--accent)" font-size="8" text-anchor="middle" letter-spacing="0.10em">NEXT NEAREST</text>

      <!-- Same scene in all three panels: five rows. -->
      <g fill="var(--muted-a20)" stroke="var(--muted)">
        <circle cx="140" cy="290" r="4"/><circle cx="260" cy="130" r="4"/><circle cx="220" cy="220" r="4"/><circle cx="70" cy="420" r="4"/><circle cx="280" cy="420" r="4"/>
        <circle cx="444" cy="290" r="4"/><circle cx="564" cy="130" r="4"/><circle cx="524" cy="220" r="4"/><circle cx="374" cy="420" r="4"/><circle cx="584" cy="420" r="4"/>
        <circle cx="748" cy="290" r="4"/><circle cx="868" cy="130" r="4"/><circle cx="828" cy="220" r="4"/><circle cx="678" cy="420" r="4"/><circle cx="888" cy="420" r="4"/>
      </g>
      <!-- Claimed state accumulates by turn. -->
      <circle cx="140" cy="290" r="4" fill="var(--ink)"/>
      <circle cx="444" cy="290" r="4" fill="var(--ink)"/><circle cx="564" cy="130" r="4" fill="var(--ink)"/>
      <circle cx="748" cy="290" r="4" fill="var(--ink)"/><circle cx="868" cy="130" r="4" fill="var(--ink)"/><circle cx="828" cy="220" r="4" fill="var(--ink)"/>

      <!-- Same three support points in each panel. -->
      <g fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2">
        <circle cx="92" cy="230" r="6"/><circle cx="180" cy="136" r="6"/><circle cx="190" cy="300" r="6"/>
        <circle cx="396" cy="230" r="6"/><circle cx="484" cy="136" r="6"/><circle cx="494" cy="300" r="6"/>
        <circle cx="700" cy="230" r="6"/><circle cx="788" cy="136" r="6"/>
      </g>
      <circle cx="798" cy="300" r="6" fill="var(--accent-a08)" stroke="var(--accent)" stroke-width="1.2"/>
      <g fill="var(--ink)" font-size="9" font-weight="700" text-anchor="middle">
        <text x="80" y="218">1</text><text x="168" y="124">2</text><text x="194" y="288">3</text>
        <text x="384" y="218">1</text><text x="472" y="124">2</text><text x="498" y="288">3</text>
        <text x="688" y="218">1</text><text x="776" y="124">2</text>
      </g>
      <text x="802" y="288" fill="var(--accent)" font-size="9" font-weight="700">3</text>

      <text x="904" y="452" fill="var(--muted)" font-size="13" font-style="italic" text-anchor="end">musical chairs:</text>
      <text x="904" y="470" fill="var(--muted)" font-size="13" font-style="italic" text-anchor="end">the nearest empty chair</text>
      <path d="M 760 448 Q 820 436 876 420" fill="none" stroke="var(--ink-a40)" stroke-dasharray="4,3"/>
      <circle cx="876" cy="420" r="2" fill="var(--ink)"/>

      <g letter-spacing="0.06em">
      <line x1="40" y1="516" x2="920" y2="516" stroke="var(--ink-a12)" stroke-width="0.8"/>
      <text x="40" y="536" fill="var(--muted)" font-size="8" letter-spacing="0.12em">LEGEND</text>
      <circle cx="52" cy="560" r="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/><text x="66" y="564" fill="var(--ink)" font-size="9">SUPPORT POINT</text>
      <circle cx="188" cy="560" r="4" fill="var(--muted-a20)" stroke="var(--muted)"/><text x="200" y="564" fill="var(--ink)" font-size="9">DATA ROW</text>
      <circle cx="292" cy="560" r="4" fill="var(--ink)"/><text x="304" y="564" fill="var(--ink)" font-size="9">CLAIMED ROW</text>
      <line x1="420" y1="560" x2="444" y2="560" stroke="var(--muted)" marker-end="url(#arrow)"/><text x="452" y="564" fill="var(--ink)" font-size="9">CLAIM</text>
      <line x1="536" y1="560" x2="560" y2="560" stroke="var(--accent)" stroke-dasharray="4,3"/><text x="568" y="564" fill="var(--ink)" font-size="9">ALREADY TAKEN</text>
      </g>
    </g>
  </svg>
</body>
</html>
