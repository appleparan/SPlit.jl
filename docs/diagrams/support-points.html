<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support point pulled by the data, pushed by a neighbor</title>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f5; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="support-points-title support-points-desc">
    <title id="support-points-title">Support point pulled by data, pushed by another support point</title>
    <desc id="support-points-desc">A schematic point cloud showing one support point sitting too close to a neighboring support point, balanced between an attraction toward nearby data rows and a repulsion away from that neighbor, moving to a next position that still covers a sparse region.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- ============ FORCE ARROWS (drawn before points) ============ -->

    <!-- ATTRACTION: solid muted, toward the cluster -->
    <line x1="333" y1="315" x2="256" y2="260" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- REPULSION: dashed muted, straight away from S_dense -->
    <line x1="348" y1="321" x2="404" y2="332" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- NEXT POSITION: accent, resultant -->
    <line x1="342" y1="312" x2="352" y2="268" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#arrow-accent)"/>

    <!-- ============ DATA ROWS — dense cluster (left-center) ============ -->
    <g fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1">
      <circle cx="120" cy="160" r="4"/>
      <circle cx="160" cy="140" r="4"/>
      <circle cx="210" cy="130" r="4"/>
      <circle cx="260" cy="160" r="4"/>
      <circle cx="300" cy="200" r="4"/>
      <circle cx="110" cy="220" r="4"/>
      <circle cx="150" cy="200" r="4"/>
      <circle cx="200" cy="190" r="4"/>
      <circle cx="240" cy="220" r="4"/>
      <circle cx="280" cy="250" r="4"/>
      <circle cx="130" cy="270" r="4"/>
      <circle cx="170" cy="250" r="4"/>
      <circle cx="210" cy="260" r="4"/>
      <circle cx="250" cy="290" r="4"/>
      <circle cx="290" cy="300" r="4"/>
      <circle cx="170" cy="300" r="4"/>
    </g>

    <!-- ============ DATA ROWS — sparse spread (right / bottom-right) ============ -->
    <g fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1">
      <circle cx="560" cy="120" r="4"/>
      <circle cx="660" cy="160" r="4"/>
      <circle cx="760" cy="120" r="4"/>
      <circle cx="860" cy="180" r="4"/>
      <circle cx="600" cy="320" r="4"/>
      <circle cx="700" cy="380" r="4"/>
      <circle cx="820" cy="300" r="4"/>
      <circle cx="880" cy="420" r="4"/>
      <circle cx="520" cy="460" r="4"/>
      <circle cx="680" cy="480" r="4"/>
    </g>

    <!-- ============ SUPPORT POINTS ============ -->

    <!-- S_dense: inside the lower part of the cluster -->
    <circle cx="232" cy="300" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
    <!-- S_right -->
    <circle cx="760" cy="220" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
    <!-- S_bottom -->
    <circle cx="560" cy="440" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>

    <!-- focal support point F (current position) -->
    <circle cx="340" cy="320" r="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>

    <!-- next position (dashed-outline accent circle) -->
    <circle cx="352" cy="268" r="6" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="3,2"/>

    <!-- ============ EDITORIAL ASIDE ============ -->
    <text x="912" y="76" fill="#4f5d75" font-size="13" font-style="italic" font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif" text-anchor="end">enough repulsion to still</text>
    <text x="912" y="96" fill="#4f5d75" font-size="13" font-style="italic" font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif" text-anchor="end">cover where the data is sparse</text>
    <path d="M 860 104 Q 820 150 764 232" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="764" cy="236" r="2" fill="#2d3142"/>

    <!-- ============ LEGEND ============ -->
    <line x1="40" y1="516" x2="920" y2="516" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

    <circle cx="52" cy="540" r="4" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
    <text x="64" y="544" fill="#4f5d75" font-size="9" font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif" letter-spacing="0.10em">DATA ROW</text>

    <circle cx="196" cy="540" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
    <text x="210" y="544" fill="#4f5d75" font-size="9" font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif" letter-spacing="0.10em">SUPPORT POINT</text>

    <line x1="360" y1="540" x2="384" y2="540" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="392" y="544" fill="#4f5d75" font-size="9" font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif" letter-spacing="0.10em">ATTRACTION</text>

    <line x1="516" y1="540" x2="540" y2="540" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="548" y="544" fill="#4f5d75" font-size="9" font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif" letter-spacing="0.10em">REPULSION</text>

    <line x1="672" y1="540" x2="696" y2="540" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
    <text x="704" y="544" fill="#4f5d75" font-size="9" font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif" letter-spacing="0.10em">NEXT POSITION</text>
  </svg>
</body>
</html>
