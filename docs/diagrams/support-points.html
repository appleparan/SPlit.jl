<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support point forces</title>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif; background: var(--paper); padding: 2rem; }
    svg { width: 100%; max-width: 960px; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="support-points-title support-points-desc">
    <title id="support-points-title">A support point balances attraction and repulsion</title>
    <desc id="support-points-desc">One support point is pulled toward a dense cluster of rows and pushed away from the support point it crowds; the two forces add, shown as a parallelogram, and the point moves to the resultant's tip, toward the data but off the neighbor.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="var(--paper)"/>

    <!--
      Vector check (SVG coordinates, +y downward):
      attraction F=(432,296) -> (282,288) = (-150,-8);
      repulsion F=(432,296) -> (506,266) = (+74,-30);
      sum F=(432,296) -> (356,258) = (-76,-38).
    -->

    <!-- Axis, parallelogram, vectors, asides, labels, and marks are drawn in that order. -->
    <g fill="none">
      <line x1="352" y1="328" x2="432" y2="296" stroke="var(--ink-a30)" stroke-dasharray="4,3"/>
      <line x1="282" y1="288" x2="356" y2="258" stroke="var(--ink-a20)" stroke-dasharray="3,3"/>
      <line x1="506" y1="266" x2="356" y2="258" stroke="var(--ink-a20)" stroke-dasharray="3,3"/>
      <line x1="432" y1="296" x2="282" y2="288" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#arrow)"/>
      <line x1="432" y1="296" x2="506" y2="266" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="432" y1="296" x2="356" y2="258" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow-accent)"/>
    </g>

    <text x="80" y="104" fill="var(--muted)" font-size="13" font-style="italic">pulled toward the rows —</text>
    <text x="80" y="124" fill="var(--muted)" font-size="13" font-style="italic">ice-cream trucks go where people are</text>
    <path d="M 262 132 Q 272 208 290 274" fill="none" stroke="var(--ink-a40)" stroke-dasharray="4,3"/>
    <circle cx="290" cy="276" r="2" fill="var(--ink)"/>
    <text x="880" y="104" fill="var(--muted)" font-size="13" font-style="italic" text-anchor="end">pushed off the neighbor it crowds —</text>
    <text x="880" y="124" fill="var(--muted)" font-size="13" font-style="italic" text-anchor="end">but not where another truck already is</text>
    <path d="M 700 132 Q 604 200 514 256" fill="none" stroke="var(--ink-a40)" stroke-dasharray="4,3"/>
    <circle cx="514" cy="258" r="2" fill="var(--ink)"/>

    <!-- Opaque arrow-label masks keep six pixels clear of strokes. -->
    <rect x="244" y="307" width="112" height="18" rx="2" fill="var(--paper)"/>
    <text x="300" y="319" fill="var(--muted)" font-size="9" text-anchor="middle" letter-spacing="0.10em">ATTRACTION</text>
    <rect x="434" y="293" width="112" height="18" rx="2" fill="var(--paper)"/>
    <text x="490" y="305" fill="var(--muted)" font-size="9" text-anchor="middle" letter-spacing="0.10em">REPULSION</text>
    <rect x="300" y="227" width="112" height="18" rx="2" fill="var(--paper)"/>
    <text x="356" y="239" fill="var(--accent)" font-size="9" text-anchor="middle" letter-spacing="0.10em">NEXT POSITION</text>
    <text x="352" y="350" fill="var(--ink)" font-size="9" text-anchor="middle"><tspan font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif" font-style="italic">S</tspan></text>
    <text x="444" y="314" fill="var(--accent)" font-size="9" text-anchor="start"><tspan font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif" font-style="italic">F</tspan></text>

    <!-- Seven dense rows, then four sparse rows. -->
    <g fill="var(--muted-a20)" stroke="var(--muted)">
      <circle cx="160" cy="240" r="4"/><circle cx="216" cy="200" r="4"/><circle cx="296" cy="224" r="4"/>
      <circle cx="176" cy="320" r="4"/><circle cx="256" cy="296" r="4"/><circle cx="312" cy="336" r="4"/><circle cx="224" cy="384" r="4"/>
      <circle cx="720" cy="200" r="4"/><circle cx="840" cy="260" r="4"/><circle cx="760" cy="420" r="4"/><circle cx="880" cy="380" r="4"/>
    </g>

    <circle cx="352" cy="328" r="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
    <circle cx="800" cy="320" r="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
    <circle cx="432" cy="296" r="6" fill="var(--accent-a08)" stroke="var(--accent)" stroke-width="1.2"/>
    <circle cx="356" cy="258" r="6" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="3,2"/>

    <line x1="40" y1="516" x2="920" y2="516" stroke="var(--ink-a12)" stroke-width="0.8"/>
    <text x="40" y="536" fill="var(--muted)" font-size="8" letter-spacing="0.12em">LEGEND</text>
    <circle cx="52" cy="560" r="4" fill="var(--muted-a20)" stroke="var(--muted)"/>
    <text x="64" y="564" fill="var(--ink)" font-size="9" letter-spacing="0.08em">DATA ROW</text>
    <circle cx="168" cy="560" r="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
    <text x="182" y="564" fill="var(--ink)" font-size="9" letter-spacing="0.08em">SUPPORT POINT</text>
    <circle cx="324" cy="560" r="6" fill="var(--accent-a08)" stroke="var(--accent)" stroke-width="1.2"/>
    <text x="338" y="564" fill="var(--ink)" font-size="9" letter-spacing="0.08em">FOCAL POINT</text>
    <line x1="452" y1="560" x2="476" y2="560" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="484" y="564" fill="var(--ink)" font-size="9" letter-spacing="0.08em">ATTRACTION</text>
    <line x1="600" y1="560" x2="624" y2="560" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="632" y="564" fill="var(--ink)" font-size="9" letter-spacing="0.08em">REPULSION</text>
    <circle cx="764" cy="560" r="6" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="778" y="564" fill="var(--ink)" font-size="9" letter-spacing="0.08em">NEXT POSITION</text>
  </svg>
</body>
</html>
