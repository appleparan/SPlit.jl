<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One MM update in three parts</title>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif; background: var(--paper); padding: 2rem; }
    svg { width: 100%; max-width: 960px; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mm-update-title mm-update-desc">
    <title id="mm-update-title">One MM update separates data pull, repulsion, and movement</title>
    <desc id="mm-update-desc">Three panels repeat the same four-row scene. The first forms an inverse-distance weighted mean, the second adds equal-length unit repulsions away from two other support points, and the third moves the focal support point to their computed sum inside the data bounding box.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="var(--paper)"/>

    <!--
      MM geometry check in each panel's local coordinates:
      ξ_m=(144,260); rows A-D=(56,112),(72,220),(196,156),(224,316).
      Inverse-distance weights=(0.005807675,0.012141073,0.008600261,0.010240399), total W=0.036789409.
      Weighted mean μ=(140.771159,214.711322).
      Other points=(224,268),(128,360); unit vectors away from them are
      u1=(-0.995037,-0.099504), u2=(0.157991,-0.987441), sum=(-0.837047,-1.086944).
      The displayed scene has N=4 rows and n=3 support points, so N/n=4/3.
      Thus μ+(4/3)(u1+u2)/W=(110.434649,175.317943), drawn as (110.43,175.32).
      Panel 2 display arrows are both length 44: endpoints (100.22,255.62) and (150.95,216.55).
    -->

    <g font-family="Pretendard, Helvetica, 'Helvetica Neue', 'Nimbus Sans', Arial, sans-serif">
      <rect x="32" y="40" width="288" height="452" rx="6" fill="var(--surface)" stroke="var(--rule)"/>
      <rect x="336" y="40" width="288" height="452" rx="6" fill="var(--surface)" stroke="var(--rule)"/>
      <rect x="640" y="40" width="288" height="452" rx="6" fill="var(--surface)" stroke="var(--rule)"/>
      <text x="52" y="68" fill="var(--muted)" font-size="9" letter-spacing="0.12em">① DATA PULL</text>
      <text x="356" y="68" fill="var(--muted)" font-size="9" letter-spacing="0.12em">② REPULSION</text>
      <text x="660" y="68" fill="var(--muted)" font-size="9" letter-spacing="0.12em">③ MOVE AND CLAMP</text>

      <!-- Panel 1: weighted lines, then their opaque label mask. -->
      <line x1="176" y1="300" x2="88" y2="152" stroke="var(--muted)" stroke-width="1.05"/>
      <line x1="176" y1="300" x2="104" y2="260" stroke="var(--muted)" stroke-width="2.2"/>
      <line x1="176" y1="300" x2="228" y2="196" stroke="var(--muted)" stroke-width="1.56"/>
      <line x1="176" y1="300" x2="256" y2="356" stroke="var(--muted)" stroke-width="1.86"/>
      <rect x="64" y="84" width="224" height="24" rx="2" fill="var(--paper)"/>
      <text x="176" y="100" fill="var(--muted)" font-size="11" text-anchor="middle" font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif"><tspan font-style="italic">w</tspan><tspan font-style="italic" font-size="7.7" dy="3">l</tspan><tspan dy="-3"> = 1/‖</tspan><tspan font-style="italic">x</tspan><tspan font-style="italic" font-size="7.7" dy="3">l</tspan><tspan dy="-3"> − </tspan><tspan font-style="italic">ξ</tspan><tspan font-style="italic" font-size="7.7" dy="3">m</tspan><tspan dy="-3">‖</tspan></text>
      <path d="M 165.77 247.71 L 179.77 261.71 M 179.77 247.71 L 165.77 261.71" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
      <rect x="120" y="218" width="112" height="18" rx="2" fill="var(--surface)"/>
      <text x="176" y="230" fill="var(--ink)" font-size="9" text-anchor="middle">weighted mean</text>

      <!-- Panel 2: faint axes and equal display-length unit arrows. -->
      <line x1="560" y1="308" x2="480" y2="300" stroke="var(--ink-a20)" stroke-dasharray="4,3"/>
      <line x1="464" y1="400" x2="480" y2="300" stroke="var(--ink-a20)" stroke-dasharray="4,3"/>
      <line x1="480" y1="300" x2="436.22" y2="295.62" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="480" y1="300" x2="486.95" y2="256.55" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#arrow)"/>
      <rect x="352" y="80" width="256" height="44" rx="2" fill="var(--paper)"/>
      <text x="480" y="98" fill="var(--muted)" font-size="9" text-anchor="middle" font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif"><tspan>(</tspan><tspan font-style="italic">N</tspan><tspan>/</tspan><tspan font-style="italic">n</tspan><tspan>) · (</tspan><tspan font-style="italic">ξ</tspan><tspan font-style="italic" font-size="6.3" dy="3">m</tspan><tspan dy="-3"> − </tspan><tspan font-style="italic">ξ</tspan><tspan font-style="italic" font-size="6.3" dy="3">o</tspan><tspan dy="-3">)</tspan></text>
      <text x="480" y="114" fill="var(--muted)" font-size="9" text-anchor="middle" font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif"><tspan>/ ‖</tspan><tspan font-style="italic">ξ</tspan><tspan font-style="italic" font-size="6.3" dy="3">m</tspan><tspan dy="-3"> − </tspan><tspan font-style="italic">ξ</tspan><tspan font-style="italic" font-size="6.3" dy="3">o</tspan><tspan dy="-3">‖</tspan></text>

      <!-- Panel 3: clamp box, old mean, and computed MM step. -->
      <rect x="696" y="152" width="168" height="204" rx="4" fill="none" stroke="var(--ink-a30)" stroke-dasharray="4,4"/>
      <text x="708" y="172" fill="var(--soft)" font-size="8" letter-spacing="0.12em">CLAMP BOX</text>
      <path d="M 773.77 247.71 L 787.77 261.71 M 787.77 247.71 L 773.77 261.71" fill="none" stroke="var(--ink-a20)" stroke-width="1.4"/>
      <line x1="784" y1="300" x2="750.43" y2="215.32" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#arrow-accent)"/>

      <!-- The same four rows and two other support points in every panel. -->
      <g fill="var(--muted-a20)" stroke="var(--muted)">
        <circle cx="88" cy="152" r="4"/><circle cx="104" cy="260" r="4"/><circle cx="228" cy="196" r="4"/><circle cx="256" cy="356" r="4"/>
        <circle cx="392" cy="152" r="4"/><circle cx="408" cy="260" r="4"/><circle cx="532" cy="196" r="4"/><circle cx="560" cy="356" r="4"/>
        <circle cx="696" cy="152" r="4"/><circle cx="712" cy="260" r="4"/><circle cx="836" cy="196" r="4"/><circle cx="864" cy="356" r="4"/>
      </g>
      <g fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2">
        <circle cx="256" cy="308" r="6"/><circle cx="160" cy="400" r="6"/>
        <circle cx="560" cy="308" r="6"/><circle cx="464" cy="400" r="6"/>
        <circle cx="864" cy="308" r="6"/><circle cx="768" cy="400" r="6"/>
      </g>
      <g fill="var(--accent-a08)" stroke="var(--accent)" stroke-width="1.2">
        <circle cx="176" cy="300" r="6"/><circle cx="480" cy="300" r="6"/><circle cx="784" cy="300" r="6"/>
      </g>
      <circle cx="750.43" cy="215.32" r="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="3,2"/>

      <g fill="var(--muted)" font-size="9">
        <text x="78" y="140">A</text><text x="92" y="276">B</text><text x="238" y="188">C</text><text x="264" y="372">D</text>
        <text x="382" y="140">A</text><text x="396" y="276">B</text><text x="542" y="188">C</text><text x="568" y="372">D</text>
        <text x="686" y="140">A</text><text x="700" y="276">B</text><text x="846" y="188">C</text><text x="872" y="372">D</text>
      </g>
      <g fill="var(--ink)" font-size="9" font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif">
        <text x="260" y="296"><tspan font-style="italic">ξ</tspan><tspan font-size="6.3" dy="3">o</tspan></text><text x="144" y="416"><tspan font-style="italic">ξ</tspan><tspan font-size="6.3" dy="3">o</tspan></text>
        <text x="564" y="296"><tspan font-style="italic">ξ</tspan><tspan font-size="6.3" dy="3">o</tspan></text><text x="448" y="416"><tspan font-style="italic">ξ</tspan><tspan font-size="6.3" dy="3">o</tspan></text>
        <text x="868" y="296"><tspan font-style="italic">ξ</tspan><tspan font-size="6.3" dy="3">o</tspan></text><text x="752" y="416"><tspan font-style="italic">ξ</tspan><tspan font-size="6.3" dy="3">o</tspan></text>
      </g>
      <g fill="var(--accent)" font-size="9" font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif">
        <text x="184" y="316"><tspan font-style="italic">ξ</tspan><tspan font-size="6.3" dy="3">m</tspan></text>
        <text x="488" y="316"><tspan font-style="italic">ξ</tspan><tspan font-size="6.3" dy="3">m</tspan></text>
        <text x="792" y="316"><tspan font-style="italic">ξ</tspan><tspan font-size="6.3" dy="3">m</tspan><tspan dy="-8" font-size="6.3">(t)</tspan></text>
        <text x="714" y="212"><tspan font-style="italic">ξ</tspan><tspan font-size="6.3" dy="3">m</tspan><tspan dy="-8" font-size="6.3">(t+1)</tspan></text>
      </g>

      <text x="904" y="444" fill="var(--muted)" font-size="13" font-style="italic" text-anchor="end">every sweep can only</text>
      <text x="904" y="462" fill="var(--muted)" font-size="13" font-style="italic" text-anchor="end">lower the energy distance</text>
      <path d="M 820 430 Q 792 396 780 340" fill="none" stroke="var(--ink-a40)" stroke-dasharray="4,3"/>
      <circle cx="780" cy="340" r="2" fill="var(--ink)"/>

      <g letter-spacing="0.06em">
      <line x1="40" y1="516" x2="920" y2="516" stroke="var(--ink-a12)" stroke-width="0.8"/>
      <text x="40" y="536" fill="var(--muted)" font-size="8" letter-spacing="0.12em">LEGEND</text>
      <circle cx="52" cy="560" r="4" fill="var(--muted-a20)" stroke="var(--muted)"/><text x="64" y="564" fill="var(--ink)" font-size="9">DATA ROW</text>
      <circle cx="148" cy="560" r="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/><text x="162" y="564" fill="var(--ink)" font-size="9">OTHER SUPPORT POINT</text>
      <circle cx="304" cy="560" r="6" fill="var(--accent-a08)" stroke="var(--accent)"/><text x="318" y="564" fill="var(--ink)" font-size="9"><tspan font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif" font-style="italic">ξ</tspan><tspan font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif" font-size="6.3" dy="3">m</tspan><tspan dy="-3"> (FOCAL)</tspan></text>
      <line x1="400" y1="560" x2="424" y2="560" stroke="var(--muted)" stroke-width="2"/><text x="432" y="564" fill="var(--ink)" font-size="9">DATA PULL (1/DISTANCE)</text>
      <line x1="600" y1="560" x2="624" y2="560" stroke="var(--muted)" marker-end="url(#arrow)"/><text x="632" y="564" fill="var(--ink)" font-size="9">REPULSION (UNIT)</text>
      <line x1="772" y1="560" x2="796" y2="560" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#arrow-accent)"/><text x="804" y="564" fill="var(--ink)" font-size="9">MM STEP</text>
      </g>
    </g>
  </svg>
</body>
</html>
