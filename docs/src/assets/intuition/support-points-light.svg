<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="support-points-title support-points-desc" width="960" height="600">
    <title id="support-points-title">A support point balances attraction and repulsion</title>
    <desc id="support-points-desc">One support point is pulled toward a dense cluster of rows and pushed away from the support point it crowds; the two forces add, shown as a parallelogram, and the point moves to the resultant's tip, toward the data but off the neighbor.</desc>
<style>
@font-face{font-family:'Pretendard';font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'STIX Two Text';font-style:italic;font-weight:400;font-display:block;src:url(data:font/woff2;base64,) format('woff2');}
</style>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgb(79, 93, 117)"></polygon></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgb(235, 108, 54)"></polygon></marker>
    </defs>

    <rect width="100%" height="100%" fill="rgb(245, 245, 245)"></rect>

    <!--
      Vector check (SVG coordinates, +y downward):
      attraction F=(432,296) -> (282,288) = (-150,-8);
      repulsion F=(432,296) -> (506,266) = (+74,-30);
      sum F=(432,296) -> (356,258) = (-76,-38).
    -->

    <!-- Axis, parallelogram, vectors, asides, labels, and marks are drawn in that order. -->
    <g fill="none">
      <line x1="352" y1="328" x2="432" y2="296" stroke="rgba(45, 49, 66, 0.3)" stroke-dasharray="4,3"></line>
      <line x1="282" y1="288" x2="356" y2="258" stroke="rgba(45, 49, 66, 0.2)" stroke-dasharray="3,3"></line>
      <line x1="506" y1="266" x2="356" y2="258" stroke="rgba(45, 49, 66, 0.2)" stroke-dasharray="3,3"></line>
      <line x1="432" y1="296" x2="282" y2="288" stroke="rgb(79, 93, 117)" stroke-width="1.6" marker-end="url(#arrow)"></line>
      <line x1="432" y1="296" x2="506" y2="266" stroke="rgb(79, 93, 117)" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow)"></line>
      <line x1="432" y1="296" x2="356" y2="258" stroke="rgb(235, 108, 54)" stroke-width="2" marker-end="url(#arrow-accent)"></line>
    </g>

    <text x="80" y="104" fill="rgb(79, 93, 117)" font-size="13" font-style="italic" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">pulled toward the rows —</text>
    <text x="80" y="124" fill="rgb(79, 93, 117)" font-size="13" font-style="italic" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">ice-cream trucks go where people are</text>
    <path d="M 262 132 Q 272 208 290 274" fill="none" stroke="rgba(45, 49, 66, 0.4)" stroke-dasharray="4,3"></path>
    <circle cx="290" cy="276" r="2" fill="rgb(45, 49, 66)"></circle>
    <text x="880" y="104" fill="rgb(79, 93, 117)" font-size="13" font-style="italic" text-anchor="end" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">pushed off the neighbor it crowds —</text>
    <text x="880" y="124" fill="rgb(79, 93, 117)" font-size="13" font-style="italic" text-anchor="end" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">but not where another truck already is</text>
    <path d="M 700 132 Q 604 200 514 256" fill="none" stroke="rgba(45, 49, 66, 0.4)" stroke-dasharray="4,3"></path>
    <circle cx="514" cy="258" r="2" fill="rgb(45, 49, 66)"></circle>

    <!-- Opaque arrow-label masks keep six pixels clear of strokes. -->
    <rect x="244" y="307" width="112" height="18" rx="2" fill="rgb(245, 245, 245)"></rect>
    <text x="300" y="319" fill="rgb(79, 93, 117)" font-size="9" text-anchor="middle" letter-spacing="0.10em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">ATTRACTION</text>
    <rect x="434" y="293" width="112" height="18" rx="2" fill="rgb(245, 245, 245)"></rect>
    <text x="490" y="305" fill="rgb(79, 93, 117)" font-size="9" text-anchor="middle" letter-spacing="0.10em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">REPULSION</text>
    <rect x="300" y="227" width="112" height="18" rx="2" fill="rgb(245, 245, 245)"></rect>
    <text x="356" y="239" fill="rgb(235, 108, 54)" font-size="9" text-anchor="middle" letter-spacing="0.10em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">NEXT POSITION</text>
    <text x="352" y="350" fill="rgb(45, 49, 66)" font-size="9" text-anchor="middle" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif"><tspan font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif" font-style="italic">S</tspan></text>
    <text x="444" y="314" fill="rgb(235, 108, 54)" font-size="9" text-anchor="start" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif"><tspan font-family="'STIX Two Text', 'DejaVu Math TeX Gyre', 'Times New Roman', serif" font-style="italic">F</tspan></text>

    <!-- Seven dense rows, then four sparse rows. -->
    <g fill="rgba(79, 93, 117, 0.2)" stroke="rgb(79, 93, 117)">
      <circle cx="160" cy="240" r="4"></circle><circle cx="216" cy="200" r="4"></circle><circle cx="296" cy="224" r="4"></circle>
      <circle cx="176" cy="320" r="4"></circle><circle cx="256" cy="296" r="4"></circle><circle cx="312" cy="336" r="4"></circle><circle cx="224" cy="384" r="4"></circle>
      <circle cx="720" cy="200" r="4"></circle><circle cx="840" cy="260" r="4"></circle><circle cx="760" cy="420" r="4"></circle><circle cx="880" cy="380" r="4"></circle>
    </g>

    <circle cx="352" cy="328" r="6" fill="rgb(245, 245, 245)" stroke="rgb(45, 49, 66)" stroke-width="1.2"></circle>
    <circle cx="800" cy="320" r="6" fill="rgb(245, 245, 245)" stroke="rgb(45, 49, 66)" stroke-width="1.2"></circle>
    <circle cx="432" cy="296" r="6" fill="rgba(235, 108, 54, 0.08)" stroke="rgb(235, 108, 54)" stroke-width="1.2"></circle>
    <circle cx="356" cy="258" r="6" fill="rgb(245, 245, 245)" stroke="rgb(235, 108, 54)" stroke-width="1.2" stroke-dasharray="3,2"></circle>

    <line x1="40" y1="516" x2="920" y2="516" stroke="rgba(45, 49, 66, 0.12)" stroke-width="0.8"></line>
    <text x="40" y="536" fill="rgb(79, 93, 117)" font-size="8" letter-spacing="0.12em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">LEGEND</text>
    <circle cx="52" cy="560" r="4" fill="rgba(79, 93, 117, 0.2)" stroke="rgb(79, 93, 117)"></circle>
    <text x="64" y="564" fill="rgb(45, 49, 66)" font-size="9" letter-spacing="0.08em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">DATA ROW</text>
    <circle cx="168" cy="560" r="6" fill="rgb(245, 245, 245)" stroke="rgb(45, 49, 66)" stroke-width="1.2"></circle>
    <text x="182" y="564" fill="rgb(45, 49, 66)" font-size="9" letter-spacing="0.08em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">SUPPORT POINT</text>
    <circle cx="324" cy="560" r="6" fill="rgba(235, 108, 54, 0.08)" stroke="rgb(235, 108, 54)" stroke-width="1.2"></circle>
    <text x="338" y="564" fill="rgb(45, 49, 66)" font-size="9" letter-spacing="0.08em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">FOCAL POINT</text>
    <line x1="452" y1="560" x2="476" y2="560" stroke="rgb(79, 93, 117)" stroke-width="1.4" marker-end="url(#arrow)"></line>
    <text x="484" y="564" fill="rgb(45, 49, 66)" font-size="9" letter-spacing="0.08em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">ATTRACTION</text>
    <line x1="600" y1="560" x2="624" y2="560" stroke="rgb(79, 93, 117)" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"></line>
    <text x="632" y="564" fill="rgb(45, 49, 66)" font-size="9" letter-spacing="0.08em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">REPULSION</text>
    <circle cx="764" cy="560" r="6" fill="rgb(245, 245, 245)" stroke="rgb(235, 108, 54)" stroke-width="1.2" stroke-dasharray="3,2"></circle>
    <text x="778" y="564" fill="rgb(45, 49, 66)" font-size="9" letter-spacing="0.08em" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">NEXT POSITION</text>
  </svg>
