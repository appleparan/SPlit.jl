    <circle cx="276" cy="372" r="4" fill="rgb(232, 234, 240)"></circle>
    <circle cx="360" cy="312" r="4" fill="rgb(232, 234, 240)"></circle>
    <circle cx="720" cy="240" r="9" fill="none" stroke="rgb(242, 138, 90)" stroke-width="1.8"></circle>

    <text x="72" y="448" fill="rgb(180, 188, 204)" font-size="13" font-style="italic" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">team draft: add whoever best balances</text>
    <text x="72" y="468" fill="rgb(180, 188, 204)" font-size="13" font-style="italic" font-family="Pretendard, Helvetica, &quot;Helvetica Neue&quot;, &quot;Nimbus Sans&quot;, Arial, sans-serif">the roster you already have</text>
