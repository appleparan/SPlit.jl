<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="herding-title herding-desc" width="960" height="600">
    <title id="herding-title">Kernel herding chooses the row that best restores balance</title>
    <desc id="herding-desc">Two clusters contain eleven rows. All three rows selected so far are in the left cluster, so the next pick is a row in the previously uncovered right cluster.</desc>
<style>
@font-face{font-family:'Pretendard';font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,) format('woff2');}
</style>
    <defs>
