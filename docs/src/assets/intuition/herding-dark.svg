      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgb(242, 138, 90)"></polygon></marker>
    </defs>
    <rect width="100%" height="100%" fill="rgb(38, 43, 43)"></rect>

