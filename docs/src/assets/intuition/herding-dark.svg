      <circle cx="156" cy="196" r="4"></circle><circle cx="260" cy="156" r="4"></circle><circle cx="344" cy="232" r="4"></circle>
      <circle cx="172" cy="332" r="4"></circle><circle cx="276" cy="372" r="4"></circle><circle cx="360" cy="312" r="4"></circle>
