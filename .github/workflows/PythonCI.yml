name: Python CI

on:
  push:
    branches:
      - main
    paths:
      - "splitiq/**"
      - "src/**"
      - "Project.toml"
      - ".github/workflows/PythonCI.yml"
  pull_request:
    branches:
      - main
    paths:
      - "splitiq/**"
      - "src/**"
      - "Project.toml"
      - ".github/workflows/PythonCI.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    working-directory: splitiq

jobs:
  lint:
    name: Lint (splitiq)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: splitiq/uv.lock
      - name: Set up Python
        run: uv python install 3.13
      - name: Install the project
        run: uv sync --group dev --group docs --frozen
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Build docs
        run: uv run mkdocs build --strict
      - name: Build wheel
        run: uv build

  test:
    name: Test (splitiq) - py${{ matrix.python-version }} - ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.12"
          - "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1"
      - name: Use Julia cache
        uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: splitiq/uv.lock
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --group dev --frozen
      - name: Build the Julia dev environment (SPlit.jl from this checkout)
        run: sh scripts/setup_julia_dev.sh
      - name: Run tests
        run: uv run pytest --cov
        env:
          PYTHON_JULIACALL_PROJECT: ${{ github.workspace }}/splitiq/.julia_dev
          PYTHON_JULIACALL_EXE: julia
