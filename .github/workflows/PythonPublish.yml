name: Python publish

# Publishes splitiq to PyPI from the vX.Y.Z release tag of SPlit.jl (pushed
# by hand or by TagBot). The Python and Julia versions are kept equal, and
# juliapkg.json pins SPlit.jl at that same tag.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

defaults:
  run:
    working-directory: splitiq

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Check that the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version="$(uv version --short)"
          test "${GITHUB_REF_NAME}" = "v${version}" \
            || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Validate package metadata (trove classifiers)
        run: uvx --from 'validate-pyproject[all]' validate-pyproject pyproject.toml
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: splitiq-dist
          path: splitiq/dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: splitiq-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
